[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macrokeyboard"
version = "0.1.0"
description = "Transform any USB keyboard into a macro keyboard with voice-to-text support"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "evdev>=1.7",
    "requests>=2.28",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: X11 Applications :: i3",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: System :: Hardware :: Hardware Drivers",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
clipboard = [
    "xclip",
]

[project.scripts]
macrokeyboard = "macrokeyboard.cli:main"

[project.urls]
"Homepage" = "https://github.com/bloodsurfer/macrokeyboard"
"Bug Tracker" = "https://github.com/bloodsurfer/macrokeyboard/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
markers = [
    "integration: tests that require hardware (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["macrokeyboard"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "I", "W"]

[tool.setuptools.packages.find]
include = ["macrokeyboard*"]
exclude = ["tests*", "scripts*"]
